name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Build
        run: |
          xcodebuild -project bkey.xcodeproj -scheme bkey -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Unit tests
        run: |
          xcodebuild -project bkey.xcodeproj -scheme bkey -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO test -only-testing:bkeyTests
